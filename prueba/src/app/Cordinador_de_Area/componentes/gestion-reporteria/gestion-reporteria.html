<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden mb-4">
        <div class="card-header bg-dark text-white p-4 border-0 bg-gradient">
          <div class="d-flex align-items-center">
            <div class="bg-warning p-2 rounded-3 me-3 shadow-sm">
              <i class="bi bi-clock-history fs-4 text-dark"></i>
            </div>
            <div>
              <h4 class="mb-0 fw-bold">Distribución de Horas</h4>
              <small class="text-white-50">Configure el cronograma y asignaciones académicas</small>
            </div>
          </div>
        </div>

        <div class="card-body p-4 p-md-5 bg-white">
          <form #f="ngForm" (ngSubmit)="SenEnviar()" class="row g-4">
            
            <div class="col-md-6">
              <label class="form-label fw-bold text-dark small text-uppercase">Módulo Académico</label>
              <div class="input-group custom-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-layers text-primary"></i></span>
               <select class="form-select border-start-0 ps-0 shadow-none" 
                  name="idModulo" [(ngModel)]="cronograma.idModulo" (change)="cargarAsignaciones()" required>
                  <option [value]="null" disabled>Seleccione Módulo...</option>
                  <option *ngFor="let m of modulos" [value]="m.idModulo">
                    {{ m.nombre }}
                  </option>
              </select>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold text-dark small text-uppercase">Asignación Docente</label>
              <div class="input-group custom-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-check text-primary"></i></span>
               <select class="form-select border-start-0 ps-0 shadow-none" 
                    name="idAsignacion" [(ngModel)]="cronograma.idAsignacion" required>
                    <option [value]="null" disabled>Seleccione Docente...</option>
                    <option *ngFor="let a of asignaciones" [value]="a.id">
                      {{ a.nombre }} - {{ a.carrera }}
                    </option>
                </select>
              </div>
            </div>

<div class="col-12">
  <label class="form-label fw-bold text-dark small text-uppercase">Día de la Semana</label>
  <div class="input-group custom-group">
    <span class="input-group-text bg-light border-end-0"><i class="bi bi-calendar-event text-primary"></i></span>
    <select class="form-select border-start-0 ps-0 shadow-none" 
            name="diasem" [(ngModel)]="cronograma.diasem" required>
      <option value="" disabled>Seleccione una opción...</option>
      <option value="Lunes">Lunes</option>
      <option value="Martes">Martes</option>
      <option value="Miércoles">Miércoles</option>
      <option value="Jueves">Jueves</option>
      <option value="Viernes">Viernes</option>
      <option value="Sábado">Sábado</option>
      <hr class="dropdown-divider"> <option value="Lunes a Viernes" class="fw-bold text-primary">Lunes a Viernes (Semana completa)</option>
      <option value="Todos los días" class="fw-bold text-success">Todos los días (Incluye Sábado)</option>
    </select>
  </div>
</div>

            <div class="col-md-6">
              <label class="form-label fw-bold text-dark small text-uppercase">Hora de Inicio</label>
              <div class="input-group custom-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-alarm text-primary"></i></span>
                <input type="time" class="form-control border-start-0 ps-0 shadow-none" 
                       name="horaI" [(ngModel)]="cronograma.horaI" required>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold text-dark small text-uppercase">Duración (Horas)</label>
              <div class="input-group custom-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-hourglass-split text-primary"></i></span>
                <input type="number" class="form-control border-start-0 ps-0 shadow-none" 
                       name="horas" [(ngModel)]="cronograma.horas" min="1" max="8" required>
              </div>
            </div>

            <div class="col-12 mt-4">
              <div class="p-3 rounded-3 bg-light border-start border-4 border-warning shadow-sm">
                <p class="mb-0 small text-muted">
                  <i class="bi bi-info-circle-fill text-warning me-2"></i> 
                  Se registrará esta carga horaria en el sistema de reportería general.
                </p>
              </div>
            </div>

            <div class="col-12 mt-4">
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm rounded-3 py-3" 
                        [disabled]="!f.valid">
                  <i class="bi bi-cloud-upload-fill me-2"></i> Registrar Distribución
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="bg-white p-4 rounded-4 shadow-sm d-flex justify-content-between align-items-center border border-light">
        <div>
          <h5 class="text-dark fw-bold m-0">Reporte de Cronograma</h5>
          <small class="text-muted">Descargue la lista actual en formato Excel</small>
        </div>
        <button (click)="exportToExcel()" class="btn btn-success d-flex align-items-center gap-2 shadow-sm rounded-3 px-4 py-2 hover-scale">
          <i class="bi bi-file-earmark-excel-fill fs-5"></i>
          <span class="fw-semibold">Exportar Excel</span>
        </button>
      </div>
<div class="container mt-4 mb-5">
  <div class="row justify-content-center mb-3">
    <div class="col-md-8 col-lg-7">
      <button routerLink="/inicio" class="btn btn-link text-decoration-none text-muted p-0 d-flex align-items-center gap-2 hover-back">
        <div class="bg-white shadow-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
          <i class="bi bi-arrow-left fs-5"></i>
        </div>
        <span class="fw-bold small text-uppercase tracking-wider">Volver al Panel</span>
      </button>
    </div>
  </div>

  <div class="row justify-content-center">
    </div>
  </div>
</div>
