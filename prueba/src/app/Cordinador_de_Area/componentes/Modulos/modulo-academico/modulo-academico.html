<div class="container mt-5">
  <div class="card shadow border-0 mx-auto" style="max-width: 600px;">
    <div class="card-header bg-dark text-white py-3">
      <h4 class="mb-0"><i class="bi bi-calendar-event me-2"></i>Nuevo Módulo Académico</h4>
    </div>
    
    <div class="card-body p-4">
      <form [formGroup]="moduloForm" (ngSubmit)="guardarModulo()">
        
      <div class="mb-4">
        <label class="form-label fw-bold text-dark small text-uppercase tracking-wider">Nivel del Módulo</label>
        <div class="d-flex gap-2">
          @for (num of [1, 2, 3]; track num) {
            <input type="radio" class="btn-check" name="nombre" [id]="'mod' + num" [value]="'Módulo ' + num" formControlName="nombre">
            <label class="btn btn-outline-primary flex-fill py-2 fw-bold shadow-sm rounded-3" [for]="'mod' + num">
              Módulo {{ num }}
            </label>
          }
        </div>
  
  @if (moduloForm.get('nombre')?.invalid && moduloForm.get('nombre')?.touched) {
    <div class="text-danger small mt-2">
      <i class="bi bi-exclamation-circle-fill me-1"></i> Debe seleccionar un módulo.
    </div>
  }
</div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Fecha de Inicio</label>
            <input type="date" formControlName="fehainix" class="form-control"
                   [ngClass]="{'is-invalid': moduloForm.get('fehainix')?.invalid && moduloForm.get('fehainix')?.touched}">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Fecha de Fin</label>
            <input type="date" formControlName="fechafin" class="form-control"
                   [ngClass]="{'is-invalid': moduloForm.get('fechafin')?.invalid && moduloForm.get('fechafin')?.touched}">
          </div>
        </div>

        <hr class="my-4">

        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-outline-secondary px-4" (click)="cancelar()">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary px-4 fw-bold" [disabled]="moduloForm.invalid">
            <i class="bi bi-check-circle me-1"></i> Registrar Módulo
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
